name: Build and Auto-Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all versions at once
        run: |
          echo "========================================="
          echo "Building all TCPShield versions"
          echo "Thanks Sierra"
          echo "========================================="
          
          # Stonecutter builds all versions at once
          ./gradlew build --no-daemon --no-configuration-cache
          
          echo "Build completed!"

      - name: Collect and rename built JARs
        run: |
          mkdir -p all-builds
          
          # Find all built JAR files and rename them with version
          for dir in versions/*/; do
            if [ -d "$dir/build/libs" ]; then
              VERSION=$(basename "$dir")
          
              # Copy and rename main JAR only
              if [ -f "$dir/build/libs/TCPShield-2.8.1.jar" ]; then
                cp "$dir/build/libs/TCPShield-2.8.1.jar" "all-builds/TCPShield-2.8.1-mc$VERSION.jar"
                echo "Copied: TCPShield-2.8.1-mc$VERSION.jar"
              fi
            fi
          done
          
          echo "JAR files collected: $(ls -1 all-builds/*.jar 2>/dev/null | wc -l)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TCPShield-all-versions
          path: all-builds/*.jar
          if-no-files-found: warn
          retention-days: 30

      # Auto-release on main branch only
      - name: Delete old latest release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Latest Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Build
          body: |
            # TCPShield Mod - Latest Build
            
            **Build Date:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
            
            ## Available Minecraft Versions
            
            This build includes support for Minecraft versions from 1.16 to 1.21.8
            
            ## Installation
            
            1. Download the JAR file for your Minecraft version
            2. Place it in your `mods` folder
            3. Make sure you have Fabric Loader installed
            
            ## Features
            
            - Gives you the real IP address of players connecting through TCPShield
            - Allows blocking direct connections to your server from non-TCPShield IPs
            
            ## Caveats
            
            - This doesn't support Geyser, I didn't add it in and don't know if I will.
            
            ---
            *This is an automated build from the latest commit*
          artifacts: "all-builds/*.jar"
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}